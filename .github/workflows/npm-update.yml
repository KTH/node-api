name: Npm update
on:
  workflow_dispatch:
    inputs:
      skip_audit:
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 2 * * *'

jobs:
  Npm-Update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: |
          git config --global user.email "web-ci@kth.se"
          git config --global user.name "web-ci"

      - run: npm ci

      - name: Audit before
        run: npm audit --json > audit-before.json || true

      - run: npx npm-check-updates -u -t minor --cooldown 1
      - run: npm install

      - run: npm audit fix || echo "Audit fix completed with warnings"
        if: ${{ !inputs.skip_audit }}

      - name: Audit after
        run: npm audit --json > audit-after.json || true

      - name: Compare audits
        id: compare
        run: |
          node << 'EOF'
          const before = new Set(Object.keys(require('./audit-before.json').vulnerabilities || {}))
          const after = Object.keys(require('./audit-after.json').vulnerabilities || {})
          const newVulns = after.filter(packageName => !before.has(packageName))

          console.log("Before:", before.size)
          console.log("After:", after.length, "\n")

          if (before.size > 0) {
            console.log(`::warning::Pre-existing vulnerabilities (not blocking): ${[...before].join(', ')}`, "\n");
          }

          if (newVulns.length > 0) {
            console.error('New vulnerabilities introduced:', newVulns.join(', '))
            process.exit(1)
          }
          console.log('No new vulnerabilities. Proceeding.')

          EOF

      - run: npm test

      - run: git add package*.json

      - name: Commit changes
        run: |
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m 'chore(deps): Update packages - minor by github workflow'
          fi

      - run: git push
